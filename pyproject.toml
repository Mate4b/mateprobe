[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "narrative-contracts"
version = "0.1.0a3"
description = "Deterministic contracts and mutation audits for state-conditioned language generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Narrative Contracts contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
dependencies = []

[project.urls]
Repository = "https://github.com/Mate4b/narrative-contracts"
Issues = "https://github.com/Mate4b/narrative-contracts/issues"
Documentation = "https://mate4b.github.io/narrative-contracts/"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
narrative-contracts = "narrative_contracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_contracts"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/launch-draft.md", "/docs/audit-adoption-plan.md", "/PROJECT_STATUS.md",
  "/internal", "/private", "/notes", "/.docs-src", "/site",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "packages/pytest-narrative-contracts/src"]
