[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mateprobe"
version = "0.1.0a4"
description = "Mutation testing for your validators, by Mate4B"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mate4B and MateProbe contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
dependencies = []

[project.urls]
Repository = "https://github.com/Mate4b/mateprobe"
Issues = "https://github.com/Mate4b/mateprobe/issues"
Documentation = "https://mate4b.github.io/mateprobe/"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
mateprobe = "mateprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mateprobe"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/launch-draft.md", "/docs/audit-adoption-plan.md", "/PROJECT_STATUS.md",
  "/internal", "/private", "/notes", "/.docs-src", "/site",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "packages/pytest-mateprobe/src"]
