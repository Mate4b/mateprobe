name: documentation-and-published-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the published alpha, not this checkout
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          narrative-contracts==0.1.0a2 pytest-narrative-contracts==0.1.0a2
          'pydantic==2.13.5'
      - run: python scripts/check_published_docs.py --output /tmp/published-docs-evidence
      - run: python benchmarks/replay_agent_adoption.py --output /tmp/agent-adoption-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-docs-evidence
          path: |
            /tmp/published-docs-evidence
            /tmp/agent-adoption-replay

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, published-examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
