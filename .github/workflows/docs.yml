name: documentation-and-published-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the published MateProbe alpha from PyPI
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          mateprobe==0.1.0a4 pytest-mateprobe==0.1.0a4
          -r requirements-integrations.txt
      - run: python scripts/check_alpha_install.py --output /tmp/published-docs-evidence
      - run: python scripts/check_launch_package.py --output /tmp/launch-evidence
      - run: python benchmarks/study_replay.py --output /tmp/published-study-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-docs-evidence
          path: |
            /tmp/published-docs-evidence
            /tmp/launch-evidence
            /tmp/published-study-replay

  historical-a3-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the historical a3 trial dependencies
        run: python -m pip install narrative-contracts==0.1.0a3 pytest-narrative-contracts==0.1.0a3
      - run: python benchmarks/replay_agent_readiness.py --output /tmp/a3-agent-readiness
      - name: Replay frozen a3 studies byte-for-byte
        run: |
          python benchmarks/validator_study.py replay --prepared benchmarks/validator-study/prepared --captured benchmarks/validator-study/evaluation --output /tmp/a3-controlled
          python benchmarks/historical_validator_study.py replay --captured benchmarks/historical-validator-results/captured --output /tmp/a3-historical
          python benchmarks/historical_followup.py replay --captured benchmarks/historical-validator-results/compatibility-followup-v2/captured --output /tmp/a3-followup
          for file in summary.json audit-reports.json comparisons.json observations.json; do
            cmp "benchmarks/validator-study/evaluation/$file" "/tmp/a3-controlled/$file"
          done
          for file in summary.json audit-reports.json; do
            cmp "benchmarks/historical-validator-results/evaluation/$file" "/tmp/a3-historical/$file"
            cmp "benchmarks/historical-validator-results/compatibility-followup-v2/evaluation/$file" "/tmp/a3-followup/$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-a3-agent-readiness-and-studies
          path: |
            /tmp/a3-agent-readiness
            /tmp/a3-controlled
            /tmp/a3-historical
            /tmp/a3-followup

  historical-a2-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the historical trial dependencies
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          narrative-contracts==0.1.0a2 pytest-narrative-contracts==0.1.0a2
          'pydantic==2.13.5'
      - run: python benchmarks/replay_agent_adoption.py --output /tmp/agent-adoption-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-agent-adoption-replay
          path: /tmp/agent-adoption-replay

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, published-examples, historical-a2-trial, historical-a3-trial]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
