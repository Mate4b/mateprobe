name: test-and-build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]' -e ./packages/pytest-mateprobe
      - run: pytest
      - run: ruff check . && ruff format --check . && mypy
      - run: python benchmarks/run.py --variants 1 --output /tmp/narrative-benchmark
      - run: python benchmarks/expanded_mutations.py --output /tmp/expanded-mutations
      - name: Replay captured model outputs offline
        run: |
          python benchmarks/natural.py replay --input benchmarks/natural-results --output /tmp/natural-replay
          python scripts/compare_replay.py benchmarks/natural-results/evaluation/reports.json /tmp/natural-replay/reports.json --old-version 0.1.0a2 --new-version 0.1.0a4
          cmp benchmarks/natural-results/evaluation/summary.json /tmp/natural-replay/summary.json
      - name: Replay remote outputs and frozen mutation audit
        run: |
          python benchmarks/natural.py replay --input benchmarks/remote-results --output /tmp/remote-replay
          python scripts/compare_replay.py benchmarks/remote-results/evaluation/reports.json /tmp/remote-replay/reports.json --old-version 0.1.0a2 --new-version 0.1.0a4
          cmp benchmarks/remote-results/evaluation/summary.json /tmp/remote-replay/summary.json
          python benchmarks/replay_renamed_mutations.py --output /tmp/real-mutations
          cmp benchmarks/real-mutation-results/evaluation/summary.json /tmp/real-mutations/summary.json
          python scripts/compare_replay.py benchmarks/real-mutation-results/evaluation/cases.json /tmp/real-mutations/cases.json --old-version 0.1.0a2 --new-version 0.1.0a4 --report-path result.report
          python examples/five_minute_demo.py
      - name: Replay immutable validator studies with MateProbe
        run: python benchmarks/study_replay.py --output /tmp/mateprobe-study-replay
      - name: Audit existing validators offline
        run: python examples/audit_existing_validator.py --output /tmp/validator-audit
      - run: python -m build && python -m build packages/pytest-mateprobe
      - name: Source mutation regression checks
        if: matrix.python == '3.12'
        run: python benchmarks/mutate_guards.py --output /tmp/source-mutations.json
  external-integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install optional integration dependencies
        run: python -m pip install -e '.[dev]' -r requirements-integrations.txt
      - name: Exercise real third-party validators
        run: python -m pytest tests/test_external_validators.py -q
      - name: Produce integration evidence
        if: always()
        run: python examples/external_validators.py --output /tmp/integration-audits
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-validator-audits-py${{ matrix.python }}
          path: /tmp/integration-audits
          if-no-files-found: warn
  installed-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install wheels without editable source
        run: |
          python -m pip install build twine
          python -m build --outdir /tmp/core-dist
          python -m build packages/pytest-mateprobe --outdir /tmp/plugin-dist
          python -m twine check --strict /tmp/core-dist/* /tmp/plugin-dist/*
          python -m pip install /tmp/core-dist/*.whl /tmp/plugin-dist/*.whl -r requirements-integrations.txt
      - name: Exercise installed APIs, docs and pytest plugin
        run: python scripts/check_alpha_install.py --output /tmp/alpha-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-install-evidence
          path: /tmp/alpha-install
