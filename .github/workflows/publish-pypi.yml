name: publish-verified-alpha-to-pypi
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the selected verified alpha artifacts to PyPI (false = dry run)'
        type: boolean
        default: false
        required: true
      version:
        description: 'Released artifact version'
        type: choice
        default: 0.1.0a4
        options:
          - 0.1.0a4
      package:
        description: 'Package selection for publishing or recovery'
        type: choice
        default: both
        options:
          - both
          - core
          - plugin
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Mate4b/mateprobe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download already released artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v${RELEASE_VERSION}" --repo Mate4b/mateprobe \
            --pattern '*.whl' --pattern '*.tar.gz' --dir downloaded
          python scripts/stage_pypi_a4.py --source downloaded --output pypi-dist
      - name: Check metadata and wheel imports
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install twine pytest pypi-dist/*.whl
          python -m twine check --strict pypi-dist/*
          python -I -c 'from importlib.metadata import version; import mateprobe, os; assert version("mateprobe") == version("pytest-mateprobe") == mateprobe.__version__ == os.environ["RELEASE_VERSION"]'
          python examples/five_minute_demo.py
      - name: Exercise a4 installed APIs and integrations
        if: inputs.version == '0.1.0a4'
        run: |
          python -m pip install -r requirements-integrations.txt
          python scripts/check_alpha_install.py --output /tmp/alpha-install
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pypi-distributions
          path: pypi-dist/
          if-no-files-found: error
  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        prefix: ${{ fromJSON(inputs.package == 'core' && '["mateprobe"]' || inputs.package == 'plugin' && '["pytest_mateprobe"]' || '["mateprobe","pytest_mateprobe"]') }}
    environment:
      name: pypi
      url: https://pypi.org/project/mateprobe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-distributions
          path: dist/
      - name: Select only this package's verified files
        env:
          PACKAGE_PREFIX: ${{ matrix.prefix }}
        run: |
          mkdir upload
          mv "dist/${PACKAGE_PREFIX}"-* upload/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
