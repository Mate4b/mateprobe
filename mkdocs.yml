site_name: Narrative Contracts
site_url: https://mate4b.github.io/narrative-contracts/
site_description: Test Python validators with invalid AI output samples and valid controls. Find missed faults and wrong-reason rejections with pytest audit reports.
repo_url: https://github.com/Mate4b/narrative-contracts
edit_uri: ''
docs_dir: .docs-src
site_dir: site
strict: true
theme:
  name: mkdocs
  custom_dir: docs_theme
  color_mode: auto
  nav_style: dark
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - Start:
      - Overview: index.md
      - Test AI output validators: docs/testing-ai-output-validators.md
      - Try a validator audit: docs/launch.md
      - First audit recipe: docs/first-audit.md
      - Integration feedback: docs/integration-feedback.md
      - Quickstart: docs/quickstart.md
      - Agent integration: docs/agent-guide.md
      - Published API: docs/api-a3.md
      - Pydantic recipe: docs/pydantic.md
  - Guarantees:
      - Choosing an evaluator: docs/choosing-an-evaluator.md
      - Contract semantics: docs/contracts.md
      - Architecture: docs/architecture.md
  - Evidence:
      - Validator comparison study: docs/validator-study.md
      - Discovery and a3 integration: docs/agent-readiness.md
      - Agent integration trial: docs/agent-adoption.md
      - Real-output mutations: docs/real-output-mutations.md
      - Model pilot: docs/natural-benchmark.md
      - Expanded mutations: docs/mutation-campaign.md
      - Technical report: paper/draft.md
  - Validator audits:
      - Alpha a3 scope: docs/development-scope.md
      - Validator audits: docs/validator-audit.md
      - Adoption levels: docs/adoption-levels.md
      - Policy regression: docs/policy-regression.md
      - Audit provenance: docs/audit-provenance.md
      - External validator trials: docs/external-validator-integrations.md
      - State field bindings: docs/state-bindings.md
      - Contributing: CONTRIBUTING.md
      - Agent contributor instructions: AGENTS.md
      - Roadmap: docs/roadmap.md
